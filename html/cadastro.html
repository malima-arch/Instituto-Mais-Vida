<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro - Instituto Mais Vida</title>
        <link rel="stylesheet" href="../css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <header>
            <h1>Instituto Mais Vida</h1>
            <p>Cadastro de voluntários</p>
        </header>
        <main>
            <h2>Formulário de cadastro</h2>
            <form id="cadastro-form">
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                    <br><br>
                    <label for="cpf">Cpf:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" maxlength="14" placeholder="000.000.000-00">
                    <br><br>
                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required> 
                </fieldset>
                <fieldset>
                    <legend>Dados de contato</legend>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                    <br><br>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" maxlength="15" placeholder="(19) 99999-9999"> 
                </fieldset>
                <fieldset>
                    <legend>Endereço</legend>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required pattern="[0-9]{5}-[0-9]{3}" maxlength="9" placeholder="00000-000">
                    <br><br>
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>
                    <br><br>
                    <label for="numero">Número:</label>
                    <input type="number" id="numero" name="numero" required>
                    <br><br>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                    <br><br>
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione seu estado</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PR">Paraná</option>
                    </select>                       
                </fieldset>
                <fieldset>
                    <legend>Como deseja participar?</legend>
                    <input type="checkbox" id="voluntario" name="participacao" value="voluntario">
                    <label for="voluntario">Quero ser voluntário</label>
                    <br>
                    <input type="checkbox" id="doador" name="participacao" value="doador"> 
                    <label for="doador">Quero ser doador</label>  
                </fieldset>
                <button type="submit">Finalizar cadastro</button>
            </form>
        </main>
        <script type="module" src="/js/script.js"></script>
    </body>
</html>
